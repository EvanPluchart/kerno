# The checks of scripts/check.sh, on GitHub's runners (free for a public repository), on every push
# to main and every pull request. A branch named ci/... runs them too: the way to try a change to
# this file before it reaches main.
#   lint         fmt, clippy and cargo deny, on Linux (clippy on macOS is scripts/check.sh's)
#   test-macos   the workspace tests; GitHub's macOS runners have no Docker, so the tests that need
#                the kerno-* servers print why and skip themselves
#   test-linux   the workspace tests with the kerno-* containers, the legacy MySQL ones included
#   windows      clippy and the workspace tests on Windows, against a PostgreSQL 17 and a MySQL 8.4
#                of the image seeded as the containers by scripts/windows-test-servers.sh (K68,
#                D-137); MariaDB, SSH and the legacy MySQL servers are not there, their tests skip
#   windows-package  the release's Windows zip and installer, built by scripts/bundle-windows.sh
#                (which installs, launches and uninstalls the installer's Kerno once) and kept 7
#                days with the run, and pictures of the packaged app driven by keys against the
#                seeded PostgreSQL (scripts/windows-app-pictures.ps1)
#   macos-package    the release's .dmg, built by scripts/bundle-macos.sh and kept 7 days
# The two package jobs also leave their compiled dependencies in a cache that release.yml reads
# (shared keys): a release then compiles Kerno's own crates only on macOS and Windows.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt, clippy, deny
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GPUI's system dependencies
        run: sudo scripts/install-linux-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A failed job leaves its compiled dependencies to the next run too.
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          rust-version: ${{ steps.toolchain.outputs.channel }}

  test-macos:
    name: test (macOS, no containers)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A failed job leaves its compiled dependencies to the next run too.
          cache-on-failure: true
      - run: cargo test --workspace --no-fail-fast -- --test-threads=3

  test-linux:
    name: test (Linux, with the containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GPUI's system dependencies
        run: sudo scripts/install-linux-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A failed job leaves its compiled dependencies to the next run too.
          cache-on-failure: true
      - name: Start the kerno-* test containers
        run: scripts/test-env.sh up --legacy
      - name: Test
        run: xvfb-run -a cargo test --workspace --no-fail-fast -- --test-threads=3
        env:
          KERNO_REQUIRE_CONTAINERS: "1"
      - name: Stop the test containers
        if: always()
        run: scripts/test-env.sh down

  windows:
    name: test (Windows, PostgreSQL and MySQL)
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      # The files as they are in the repository (LF): the runner's git would turn them into CRLF,
      # which the tests' expected texts do not have.
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A PostgreSQL 17 and a MySQL 8.4 of the image, seeded as the kerno-* containers (K68).
      - name: Start the test servers
        run: scripts/windows-test-servers.sh up
      - name: Test
        run: cargo test --workspace --no-fail-fast -- --test-threads=3
        env:
          # The runner has these two; MariaDB, SSH and the legacy MySQL servers skip themselves.
          KERNO_REQUIRE_SERVERS: kerno-postgres,kerno-mysql
      # K67's runner tests, after the suite: the files they read in the runner's profile could
      # change what the suite's tests find there.
      - name: Home files for K67's tests
        run: |
          set -euo pipefail
          home="$(cygpath -u "$USERPROFILE")"
          mkdir -p "$home/.ssh"
          printf 'Host k67-probe\n  HostName 127.0.0.1\n' > "$home/.ssh/config"
          printf '[client]\npassword=not-read-on-windows\n' > "$home/.my.cnf"
          appdata="$(cygpath -u "$APPDATA")"
          mkdir -p "$appdata/postgresql"
          printf '127.0.0.1:55432:*:kerno:kerno_test_pw\n' > "$appdata/postgresql/pgpass.conf"
      - name: "K67: the home, the password files, the local clients, the update check"
        run: |
          cargo test -p kerno-core --test windows -- --nocapture --test-threads=1
          cargo test -p kerno-postgres --test tools -- windows_k67 --nocapture
          cargo test -p kerno-mysql --test tools -- windows_k67 --nocapture
          cargo test -p kerno --bin kerno -- windows_k67 --nocapture
        env:
          KERNO_K67_RUNNER: "1"
      - name: Stop the test servers
        if: always()
        run: scripts/windows-test-servers.sh down

  windows-package:
    name: release zip and installer (Windows)
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows
          cache-on-failure: true
      - name: Build, check the version, launch once, zip, build the installer and try it
        run: scripts/bundle-windows.sh
      # The packaged app at work: a connection from a URL, a query, a table, the connection
      # dialog and Settings, against the seeded PostgreSQL (K68).
      - name: Start the test servers
        run: scripts/windows-test-servers.sh up
      - name: Drive the app and keep pictures
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-app-pictures.ps1
          target/release/kerno.exe dist/pictures
      - name: Stop the test servers
        if: always()
        run: scripts/windows-test-servers.sh down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kerno-windows-x86_64
          # The zip, the installer, the pictures of the screen taken at the launch check and
          # after the install, and the app at work.
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/kerno-windows-launch.png
            dist/kerno-windows-installed.png
            dist/pictures/*.png
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: release dmg (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-macos
          cache-on-failure: true
      - name: Build, sign, launch once and pack
        run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kerno-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
