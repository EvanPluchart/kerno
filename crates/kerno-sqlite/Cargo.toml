[package]
name = "kerno-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kerno-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
# The declared type of each result column (D-102); no new crate, the
# bundled SQLite is kerno-core's.
rusqlite = { workspace = true, features = ["column_decltype"] }

[dev-dependencies]
kerno-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
