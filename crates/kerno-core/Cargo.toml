[package]
name = "kerno-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Facts about the kerno-* test containers, for integration tests.
# `xlsx::read`, which unzips a workbook in tests.
test-support = ["dep:zip"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
percent-encoding.workspace = true
russh.workspace = true
rusqlite.workspace = true
directories.workspace = true
uuid.workspace = true
keyring.workspace = true
rust_xlsxwriter.workspace = true
# The AI assistant's HTTP client (J17, D-0xx): rustls with ring and webpki-roots,
# both already in the tree; no gzip, no native-tls, no second crypto backend.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# K23 (D-095), all already in the tree: the system's trust store for the AI client (the
# drivers' rustls-native-certs), the issuer of a certificate it refuses (x509-cert, through
# tokio-postgres-rustls), and omp's models.yml (serde-saphyr, through gpui-component's i18n).
rustls.workspace = true
rustls-native-certs.workspace = true
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
serde-saphyr = "1.3"
# Already in the tree through rust_xlsxwriter.
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
# The crate's own integration tests use its test support.
kerno-core = { path = ".", features = ["test-support"] }
tempfile = "3"
