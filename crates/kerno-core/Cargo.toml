[package]
name = "kerno-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Facts about the kerno-* test containers, for integration tests.
test-support = []

[dependencies]
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
percent-encoding.workspace = true
russh.workspace = true
rusqlite.workspace = true
directories.workspace = true
uuid.workspace = true
keyring.workspace = true
rust_xlsxwriter.workspace = true
# The AI assistant's HTTP client (J17, D-0xx): rustls with ring and webpki-roots,
# both already in the tree; no gzip, no native-tls, no second crypto backend.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# K23 (D-095), all already in the tree: the system's trust store for the AI client (the
# drivers' rustls-native-certs), the issuer of a certificate it refuses (x509-cert, through
# tokio-postgres-rustls), and omp's models.yml (serde-saphyr, through gpui-component's i18n).
rustls.workspace = true
rustls-native-certs.workspace = true
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
serde-saphyr = "1.3"
# The schema document as a PDF (K32, D-105): the only two packages added for
# it, `subsetter` without `variable-fonts` (which would bring skrifa and
# write-fonts). The others were already in the tree, at the version locked:
# the brand's path data (through usvg), stream compression (through russh and
# mysql_async). The fonts' glyphs and advances are read in schema_doc/pdf/sfnt.rs:
# ttf-parser and rustybuzz are unmaintained (RUSTSEC-2026-0192, -0206).
pdf-writer = "0.15"
subsetter = { version = "0.2.6", default-features = false }
kurbo = "=0.13.1"
flate2 = "1.1"
# Kerno's own password file (K33, D-106), both already in the tree at the
# version locked: the AEAD through russh's ssh-cipher, the random source
# through several crates. No default features: aes-gcm's would pull aead's
# getrandom; the nonce and the key come from getrandom itself.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.3.4"
# Already in the tree through rust_xlsxwriter: reading DBeaver's project
# export (K41, D-114), and `xlsx::read` in tests.
zip = { version = "9", default-features = false, features = ["deflate"] }
# DBeaver's saved credentials (K41, D-114), AES-128-CBC: both already in the
# tree at the version locked, on the cipher aes-gcm uses.
aes = "0.9.4"
cbc = { version = "0.2.1", default-features = false, features = ["block-padding"] }
# A time with a zone read in the computer's (K82, D-148), both already in the
# tree at the version locked (through GPUI): the zone's offset at any date
# from the system's rules (chrono's `Local`), and the zone's IANA name.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
iana-time-zone = "0.1.65"

# The proof both ends of the running instance's pipe give on Windows (K64,
# D-131): SHA-256, already in the tree at the version locked (the app's update
# checksums use it). Windows only, and the tests of the proof everywhere.
[target.'cfg(windows)'.dependencies]
sha2 = "0.10"

[dev-dependencies]
# The crate's own integration tests use its test support.
kerno-core = { path = ".", features = ["test-support"] }
tempfile = "3"
sha2 = "0.10"
