[package]
name = "kerno-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Facts about the kerno-* test containers, for integration tests.
# `xlsx::read`, which unzips a workbook in tests.
test-support = ["dep:zip"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
percent-encoding.workspace = true
russh.workspace = true
rusqlite.workspace = true
directories.workspace = true
uuid.workspace = true
keyring.workspace = true
rust_xlsxwriter.workspace = true
# Already in the tree through rust_xlsxwriter.
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
# The crate's own integration tests use its test support.
kerno-core = { path = ".", features = ["test-support"] }
tempfile = "3"
