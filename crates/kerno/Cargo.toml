[package]
name = "kerno"
description = "A fast, native database client for macOS and Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kerno-core.workspace = true
kerno-postgres.workspace = true
kerno-mysql.workspace = true
kerno-sqlite.workspace = true
gpui-kit.workspace = true
# The types of the editor's completion API; the version the UI kit uses.
lsp-types = "=0.97.0"
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Folder icons the user picks, and the window icon on Linux. Both crates are
# already in the lock through GPUI; no feature here pulls a new crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
# The SHA-256 of an update's download (D-045); already in the lock.
sha2 = "0.10"

# The Dock icon of the bare binary (crates/kerno/src/app_icon.rs); already in
# the lock through GPUI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

# The icon of kerno.exe, compiled in by build.rs on Windows (K66); already in
# the lock through GPUI, which compiles its manifest in the same way.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
kerno-core = { workspace = true, features = ["test-support"] }
tempfile = "3"
