# Test databases for Kerno. Start them with `scripts/test-env.sh up`, which
# first generates the TLS certificates and SSH keys the containers mount.
# Every container is named kerno-*, binds to 127.0.0.1 only and uses a
# non-standard host port. The credentials below are test-only.
name: kerno

services:
  postgres:
    image: postgres:17
    container_name: kerno-postgres
    environment:
      POSTGRES_USER: kerno
      POSTGRES_PASSWORD: kerno_test_pw
      POSTGRES_DB: kerno
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      default:
        # A name the server certificate does not carry: through the SSH
        # bastion, verify-full must refuse it and verify-ca accept it.
        aliases:
          - kerno-pg-alias
    volumes:
      - ./tests/fixtures/postgres:/docker-entrypoint-initdb.d:ro
      - ./tests/fixtures/generated/tls:/kerno-tls:ro
      - kerno_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The seed creates public.kerno_seed_done last; TCP is closed during init.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U kerno -d kerno -Atc 'select 1 from public.kerno_seed_done' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 5s

  mysql:
    image: mysql:8.4
    container_name: kerno-mysql
    environment:
      MYSQL_ROOT_PASSWORD: kerno_test_pw
      MYSQL_DATABASE: kerno
      MYSQL_USER: kerno
      MYSQL_PASSWORD: kerno_test_pw
    command:
      - --character-set-server=utf8mb4
      - --local-infile=1
      - --max-connections=100
      # The generated test certificate, signed by the test CA.
      - --ssl-ca=/kerno-tls/ca.crt
      - --ssl-cert=/kerno-tls/server.crt
      - --ssl-key=/kerno-tls/server.key
    ports:
      - "127.0.0.1:53306:3306"
    networks:
      default:
        # A name the server certificate does not carry (see postgres).
        aliases:
          - kerno-mysql-alias
    volumes:
      - ./tests/fixtures/mysql:/docker-entrypoint-initdb.d:ro
      - ./tests/fixtures/generated/tls:/kerno-tls:ro
      - kerno_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -ukerno -pkerno_test_pw -N -e 'select 1 from kerno.kerno_seed_done' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 200
      start_period: 5s

  mariadb:
    image: mariadb:11
    container_name: kerno-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: kerno_test_pw
      MARIADB_DATABASE: kerno
      MARIADB_USER: kerno
      MARIADB_PASSWORD: kerno_test_pw
    command:
      - --character-set-server=utf8mb4
      - --local-infile=1
      - --max-connections=100
      - --ssl-ca=/kerno-tls/ca.crt
      - --ssl-cert=/kerno-tls/server.crt
      - --ssl-key=/kerno-tls/server.key
    ports:
      - "127.0.0.1:53307:3306"
    networks:
      default:
        aliases:
          - kerno-mariadb-alias
    volumes:
      # Same seed as MySQL: the fixture avoids engine-specific syntax.
      - ./tests/fixtures/mysql:/docker-entrypoint-initdb.d:ro
      - ./tests/fixtures/generated/tls:/kerno-tls:ro
      - kerno_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -ukerno -pkerno_test_pw -N -e 'select 1 from kerno.kerno_seed_done' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 200
      start_period: 5s

  ssh:
    build: ./tests/fixtures/ssh
    image: kerno-ssh:local
    container_name: kerno-ssh
    ports:
      - "127.0.0.1:52222:22"
    volumes:
      - ./tests/fixtures/generated/ssh/authorized_keys:/kerno-ssh/authorized_keys:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A jump host in front of kerno-ssh (OpenSSH tunnels, ProxyJump / -J):
  # same image and keys, reaches kerno-ssh:22 on the compose network.
  ssh-jump:
    build: ./tests/fixtures/ssh
    image: kerno-ssh:local
    container_name: kerno-ssh-jump
    ports:
      - "127.0.0.1:52223:22"
    volumes:
      - ./tests/fixtures/generated/ssh/authorized_keys:/kerno-ssh/authorized_keys:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Legacy MySQL servers (K22), in the `legacy` profile: started by
  # `scripts/test-env.sh up --legacy` and by scripts/check.sh. The official
  # 5.x images are amd64 only and run under emulation on Apple Silicon; there
  # is no image of 5.1, so tests/fixtures/mysql51 builds one from Oracle's
  # archived binaries. Same `kerno` user and password as kerno-mysql, seeded
  # with tests/fixtures/mysql-legacy, TLS with the test certificates.
  mysql57:
    profiles: [legacy]
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    container_name: kerno-mysql57
    environment: &legacy-env
      MYSQL_ROOT_PASSWORD: kerno_test_pw
      MYSQL_DATABASE: kerno
      MYSQL_USER: kerno
      MYSQL_PASSWORD: kerno_test_pw
    command: &legacy-command
      - --character-set-server=utf8
      - --ssl-ca=/kerno-tls/ca.crt
      - --ssl-cert=/kerno-tls/server.crt
      - --ssl-key=/kerno-tls/server-legacy.key
    ports:
      - "127.0.0.1:53357:3306"
    volumes:
      - ./tests/fixtures/mysql-legacy:/docker-entrypoint-initdb.d:ro
      - ./tests/fixtures/generated/tls:/kerno-tls:ro
    healthcheck: &legacy-health
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -ukerno -pkerno_test_pw -N -e 'select 1 from kerno.kerno_seed_done' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 200
      start_period: 5s

  mysql56:
    profiles: [legacy]
    image: mysql:5.6@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae
    platform: linux/amd64
    container_name: kerno-mysql56
    environment: *legacy-env
    command: *legacy-command
    ports:
      - "127.0.0.1:53356:3306"
    volumes:
      - ./tests/fixtures/mysql-legacy:/docker-entrypoint-initdb.d:ro
      - ./tests/fixtures/generated/tls:/kerno-tls:ro
    healthcheck: *legacy-health

  mysql55:
    profiles: [legacy]
    image: mysql:5.5@sha256:12da85ab88aedfdf39455872fb044f607c32fdc233cd59f1d26769fbf439b045
    platform: linux/amd64
    container_name: kerno-mysql55
    environment: *legacy-env
    command: *legacy-command
    ports:
      - "127.0.0.1:53355:3306"
    volumes:
      - ./tests/fixtures/mysql-legacy:/docker-entrypoint-initdb.d:ro
      - ./tests/fixtures/generated/tls:/kerno-tls:ro
    healthcheck: *legacy-health

  mysql51:
    profiles: [legacy]
    build: ./tests/fixtures/mysql51
    image: kerno-mysql51:local
    platform: linux/amd64
    container_name: kerno-mysql51
    # The server's own default character set (latin1), as most 5.1 servers
    # ran; the fixture's databases are utf8.
    command:
      - --ssl-ca=/kerno-tls/ca.crt
      - --ssl-cert=/kerno-tls/server.crt
      - --ssl-key=/kerno-tls/server-legacy.key
    ports:
      - "127.0.0.1:53351:3306"
    volumes:
      - ./tests/fixtures/mysql-legacy:/docker-entrypoint-initdb.d:ro
      - ./tests/fixtures/generated/tls:/kerno-tls:ro
    healthcheck: *legacy-health

volumes:
  kerno_postgres_data:
  kerno_mysql_data:
  kerno_mariadb_data:
