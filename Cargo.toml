[workspace]
resolver = "3"
members = ["crates/kerno", "crates/kerno-core", "crates/kerno-postgres", "crates/kerno-mysql"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kerno-core = { path = "crates/kerno-core" }
kerno-postgres = { path = "crates/kerno-postgres" }
kerno-mysql = { path = "crates/kerno-mysql" }

# GPUI and gpui-component, pinned together through the gpui-kit facade
# (see docs/DECISIONS.md, D-001).
gpui-kit = { version = "=0.9.1", features = ["tree-sitter", "tree-sitter-sql"] }

# Async runtime for the database drivers, the SSH tunnel and child processes.
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "process", "fs"] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry", "env-filter"] }
tracing-appender = "0.2"
sqlparser = "0.64"

# App storage and platform directories.
rusqlite = { version = "0.42", features = ["bundled"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
keyring = "4"
url = "2"
percent-encoding = "2"

# TLS: rustls with the ring provider everywhere (GPUI already brings both).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"

tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Line tables keep backtraces useful while keeping target/ small.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
strip = "debuginfo"
