# cargo-deny configuration: every dependency licence must be compatible with
# distributing Kerno under MIT OR Apache-2.0.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "warn"
# Security advisories always fail the check. "Unmaintained" notices fail it
# only for crates Kerno depends on directly: the ones reported today (paste,
# instant, ttf-parser, rustybuzz, zvariant, zbus_names) come in through GPUI
# and gpui-component and are theirs to replace.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences, plus MPL-2.0 (file-level copyleft: fine for unmodified
# dependencies of an MIT OR Apache-2.0 application; today `option-ext`, pulled
# in by `dirs`, and `cbindgen`, a build-time tool).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # Mozilla's root certificates as data (webpki-roots, through mysql_async).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
